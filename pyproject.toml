[project]
name = "ai-investigation-analyst"
version = "0.1.0"
description = "Detects late-delivery problems in Olist e-commerce data and uses an evidence-backed AI agent to investigate them."
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "ollama>=0.6.3",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.1",
]

[project.optional-dependencies]
claude = [
    "anthropic>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
